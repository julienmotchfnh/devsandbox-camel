schemaVersion: 2.2.0
metadata:
  name: devsandbox-camel-labs
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      env:
        - name: JAVA_HOME_TEST
          value: /home/tooling/.sdkman/candidates/java/17.0.3-tem
      endpoints:
        - exposure: none
          name: debug
          protocol: tcp
          targetPort: 5005
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080
      volumeMounts:
        - name: m2
          path: /home/user/.m2

  - name: m2
    volume:
      size: 1G

